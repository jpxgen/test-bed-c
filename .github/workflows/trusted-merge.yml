# nunnarivu factory 0.1.0 — managed by init-project; do not edit
# Trusted merge: decides on the default branch, never checking out pull-request
# code (nunnarivu factory; architecture §6 item 2, KR-13). It verifies the
# gates result, head commit and the state branch, refuses protected paths,
# squash-merges, deletes the head branch and moves the package to cleanup
# on the state branch (decision NF-012). It runs after every gates run, and
# when the review station dispatches it with the pull request it sent to merge.
name: trusted merge

on:
  workflow_run:
    workflows: ["gates"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request number the review station sent to merge
        required: true
        type: string
      head:
        description: The pull request head commit the review bound to
        required: true
        type: string

permissions: {}

jobs:
  merge:
    name: trusted merge
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Let git use the workflow token for the state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Decide and merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ inputs.head || github.event.workflow_run.head_sha }}
        run: |
          # A pull request from a fork has no number in the workflow_run payload;
          # the decider then resolves it by head sha and refuses if it is not unique.
          node .nunnarivu/bin/nunnarivu trusted-merge ${PR_NUMBER:+--pr "$PR_NUMBER"} --head "$HEAD_SHA" --json
